  - id: zh-wikisource-music
    title: 中文维基文库 古代音乐文献（公版）
    license: Public-Domain
    tier: T0
    redistributable: true
    optional: true
    fetch:
      method: wikisource_search
      site: zh.wikisource.org
      queries: [律呂, 樂律, 樂記, 琴, 聲律, 曲律, 樂府, 雅樂, 燕樂, 歌]
      search_limit: 60
      max_docs: 250
      min_chars: 4000
      max_chars: 8000000
      max_tokens: 3000000
    notes: "公版古籍（乐律/琴论/曲论等）；搜索后全文抓取"

  - id: wikipedia-audio
    title: Wikipedia 音频工程 / 音乐制作条目
    license: CC-BY-SA-4.0
    tier: T1
    redistributable: true
    optional: true
    fetch:
      method: wikipedia
      max_pages: 300
      full_text_pages: 0
      max_tokens: 0
      categories:
        - Audio engineering
        - Audio effects
        - Equalization (audio)
        - Dynamic range compression
        - Reverb
        - Mixing (music)
        - Music production
        - Audio signal processing
        - Loudness
        - Digital audio workstation
    notes: "可选源：Wikipedia 批量抓取限速严格（429），失败时跳过；后续用 dumps 补充"

