# DAWcoder 继续预训练（CPT）语料源注册表
# 只允许 redistributable: true 的源进入公开语料（cpt/build.py）。
# max_tokens 是构建预算权重（同时用于 full/lite 两种构建的比例分配）。
version: 4
corpus: dawcoder-cpt-v0.2
sources:
  - id: stackexchange-sound
    title: Sound Design Stack Exchange 全量（官方数据转储）
    license: CC-BY-SA-4.0
    tier: T1
    redistributable: true
    fetch:
      method: stackexchange_dump
      url: "https://archive.org/download/stackexchange/sound.stackexchange.com.7z"
      site: sound
      max_tokens: 6000000
    notes: "用户贡献内容 CC BY-SA 4.0；记录帖子 URL 与作者署名"

  - id: stackexchange-music
    title: Music Practice & Theory Stack Exchange 全量（官方数据转储）
    license: CC-BY-SA-4.0
    tier: T1
    redistributable: true
    fetch:
      method: stackexchange_dump
      url: "https://archive.org/download/stackexchange/music.stackexchange.com.7z"
      site: music
      max_tokens: 8000000
    notes: "用户贡献内容 CC BY-SA 4.0；记录帖子 URL 与作者署名"

  - id: stackexchange-avp
    title: Audio/Video Production Stack Exchange 全量（官方数据转储）
    license: CC-BY-SA-4.0
    tier: T1
    redistributable: true
    fetch:
      method: stackexchange_dump
      url: "https://archive.org/download/stackexchange/avp.stackexchange.com.7z"
      site: avp
      max_tokens: 4000000
    notes: "用户贡献内容 CC BY-SA 4.0；记录帖子 URL 与作者署名"

  - id: wikibooks-audio
    title: 维基教科书 音频工程/音乐制作（CC BY-SA 4.0）
    license: CC-BY-SA-4.0
    tier: T1
    redistributable: true
    optional: true
    fetch:
      method: mediawiki_search
      site: en.wikibooks.org
      queries: [audio engineering, music production, mixing, acoustics, music theory, recording, sound recording, microphone]
      search_limit: 30
      max_docs: 120
      min_chars: 1500
      max_chars: 3000000
      max_tokens: 0
    notes: "教科书条目（声学/录音/乐理），补充现代教学文本"

  - id: gutenberg-music
    title: Project Gutenberg 音乐/声学/音频类公版书
    license: Public-Domain
    tier: T0
    redistributable: true
    fetch:
      method: gutenberg
      max_books: 500
      max_tokens: 12000000
    notes: "公版书全文（音乐理论/声学/乐器/歌唱等）；去除 PG 页眉页脚"

  - id: arxiv-audio
    title: arXiv 音频/混音方向论文摘要（元数据 CC0）
    license: CC0-1.0
    tier: T0
    redistributable: true
    fetch:
      method: arxiv
      queries:
        - '"automatic mixing"'
        - '"music mixing"'
        - '"audio effects"'
        - '"source separation"'
        - '"equalization"'
        - '"dynamic range compression"'
        - '"music production"'
        - '"loudness normalization"'
        - '"spatial audio"'
        - '"reverberation"'
        - '"audio plugin"'
        - '"digital audio workstation"'
        - '"mixing console"'
        - '"music information retrieval"'
      max_results_per_query: 200
      max_tokens: 500000
    notes: "arXiv API 元数据（标题/摘要）按 CC0 1.0 提供；摘要版权归作者，按 arXiv 元数据许可使用"

  - id: dawproject-spec
    title: DAWproject 开放工程格式规范与示例（MIT）
    license: MIT
    tier: T1
    redistributable: true
    fetch:
      method: raw_url
      max_tokens: 60000
      files:
        - {url: "https://raw.githubusercontent.com/bitwig/dawproject/main/README.md", title: "DAWproject README"}
        - {url: "https://raw.githubusercontent.com/bitwig/dawproject/main/Project.xsd", title: "DAWproject Project XSD"}
        - {url: "https://raw.githubusercontent.com/bitwig/dawproject/main/MetaData.xsd", title: "DAWproject MetaData XSD"}
        - {url: "https://raw.githubusercontent.com/bitwig/dawproject/main/Reference.html", title: "DAWproject XML Reference"}
    notes: "MIT：保留版权与许可声明"

  - id: dawcoder-ir-handbook
    title: DAWcoder 参数语义手册（自建，CC0）
    license: CC0-1.0
    tier: T0
    redistributable: true
    fetch:
      method: synthetic
      from: synthetic/data
      max_docs: 900
      max_tokens: 300000
    notes: "由仓库内 SFT 合成样本转写的领域说明文本，完全自有"

